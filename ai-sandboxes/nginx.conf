# Agisphire site — static hosting on nginx.
# Two servers: the site on :8080, and a tiny /healthz on :8081 so the
# healthcheck can't interfere with request handling.
server {
    listen 8081;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Behind a host port mapping (8090→8080). nginx's directory-slash and
    # error redirects would otherwise be absolute and carry the CONTAINER
    # port, which the browser can't reach. Relative redirects inherit the
    # host the browser actually used.
    absolute_redirect off;

    # App JS (console.js, auth.js): revalidate every load. They change during
    # development and a stale copy against new markup breaks the console
    # (a cached console.js without the delete code hides the trash icon).
    location /js/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static assets (brand files, images) — cache for an hour.
    location /assets/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # API (FastAPI container). Same-origin from the browser's perspective.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE (GET /tasks/{id}/events) is a long-lived stream: disable
        # proxy buffering and let it stay open. The app sends
        # X-Accel-Buffering: no too; belt and suspenders.
        proxy_buffering off;
        proxy_http_version 1.1;
        # Planner chat waits on an LLM round-trip (seconds to a minute+);
        # SSE streams idle between nudges. Keep the read timeout generous.
        proxy_read_timeout 300s;
        proxy_send_timeout 30s;
    }

    location / {
        # HTML pages: revalidate every load so a fresh deploy is seen immediately.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Security headers (harmless for a static marketing site).
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
