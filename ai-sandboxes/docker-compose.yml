services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: agisphire-web:latest
    ports:
      - "8090:8080"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: agisphire-api:latest
    env_file:
      # Optional in dev; auth endpoints return 503 until real values are set.
      - path: .env.local
        required: false
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8090}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      DB_PATH: /data/agisphire.db
      # Real execution engine. Off unless set in .env.local; azure backend runs
      # real sandboxes, anything else stays on the simulated fallback.
      EXECUTOR_ENABLED: ${EXECUTOR_ENABLED:-0}
      EXECUTOR_BACKEND: ${EXECUTOR_BACKEND:-azure}
    volumes:
      - ags-data:/data
    restart: unless-stopped

volumes:
  ags-data:
