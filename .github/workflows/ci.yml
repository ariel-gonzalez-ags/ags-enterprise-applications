name: ci

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-sandboxes/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai-sandboxes/web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build && npm test

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-sandboxes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r api/requirements.txt
      - name: Auth flow e2e (Google mocked)
        run: python scripts/test_auth_flow.py

  images:
    runs-on: ubuntu-latest
    needs: [web, api]
    defaults:
      run:
        working-directory: ai-sandboxes
    steps:
      - uses: actions/checkout@v4
      # docker build runs the web smoke tests inside the image build;
      # a failure here means nothing shippable was produced.
      - run: docker compose build

  dependency-review:
    # Fails PRs that introduce dependencies with known vulnerabilities
    # or forbidden licenses. Complements Dependabot (which updates
    # existing deps; this gates new ones).
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
